name: Fetch encyclopedia images

# Downloads free-licensed images for the Tech Encyclopedia from Wikimedia and
# commits them to images/library. Run it by hand from the Actions tab.
#   lead    first free lead image of candidate Wikipedia articles
#   review  photo candidates for weak cards, saved to images/library/_review
#   apply   download tools/library_image_picks.json, then convert all to WebP
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [review, apply, lead]
        default: review

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow (for WebP conversion)
        run: python3 -m pip install --quiet Pillow

      - name: Run
        run: |
          python3 tools/fetch_library_images.py "${{ inputs.mode }}"
          if [ "${{ inputs.mode }}" != "review" ]; then
            python3 tools/fetch_library_images.py optimize
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/library
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Encyclopedia images: ${{ inputs.mode }} run"
          git push
