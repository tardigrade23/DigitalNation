name: Deploy to GitHub Pages

# Publishes the game whenever the repository's default branch changes.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html privacy.html terms.html style.css content.js game.js i18n.js sw.js manifest.webmanifest _site/
          cp -r icons vendor images lang _site/

      # Şəxsi Akademiya: an installable learning app served at /akademiya/ (see akademiya/README.md).
      - name: Add Akademiya
        run: bash akademiya/tools/build_pwa.sh _site/akademiya

      # The guide (a static wiki) is generated from the game itself in headless Chromium.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the guide
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/build_guide.mjs _site/guide

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
